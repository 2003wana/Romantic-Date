<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff8f0">
<title>وزارة الطلعات والشؤون الزوجية 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap');
:root{--cream:#fff8f0;--pink:#f7b7c9;--hot:#ef729c;--purple:#a996d9;--ink:#292333;--yellow:#ffe59a;--green:#bfe6cb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:'Changa',system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#e9a5bb 1.2px,transparent 1.2px);background-size:20px 20px;z-index:-1}
.wrap{width:min(100% - 28px,560px);margin:0 auto;padding:28px 0 36px;min-height:100vh;display:flex;align-items:center}
.card{width:100%;background:#fffdfb;border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:25px 22px 24px;position:relative;overflow:hidden;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:700}
.stamp{background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:5px 10px;transform:rotate(-3deg)}
.mini{color:#766d7e}
.heart{font-size:72px;line-height:1.15;text-align:center;margin:18px auto 10px;filter:drop-shadow(3px 4px 0 #f6d5df);animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
h1,h2,p{margin-top:0}
h1{font-size:clamp(27px,7vw,38px);line-height:1.35;text-align:center;margin-bottom:10px;font-weight:800}
h2{font-size:clamp(22px,5.8vw,30px);line-height:1.45;text-align:center;margin:22px 0 8px}
.sub{text-align:center;color:#746b7c;font-size:15px;line-height:1.9;margin:0 auto 22px;max-width:420px}
.btn{font:700 16px 'Changa',sans-serif;border:2.5px solid var(--ink);border-radius:15px;padding:13px 16px;background:white;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .13s,box-shadow .13s;min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pink);width:100%;margin-top:10px}
.btn.secondary{background:#fff;width:100%;margin-top:12px}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0 12px}
.option{background:#fff;border:2.5px solid var(--ink);border-radius:16px;min-height:91px;padding:12px 9px;font:700 15px 'Changa',sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .15s,background .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.option .emoji{font-size:28px;line-height:1.1}
.option:hover{transform:translateY(-2px)}
.option.good{background:#fce0e9}
.option.bad{animation:shake .38s ease;background:#fff0f0}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.notice{display:none;text-align:center;background:#fff0f4;border:2px dashed var(--hot);border-radius:14px;padding:12px 13px;margin:15px 0 6px;font-weight:700;line-height:1.8;animation:pop .25s ease}
.notice.show{display:block}
.progress{display:flex;gap:5px;justify-content:center;margin:18px 0 4px}
.progress span{height:7px;flex:1;max-width:50px;background:#eee4e8;border-radius:10px;border:1px solid #292333}
.progress span.active{background:var(--hot)}
.question-tag{display:inline-block;background:#eee8fb;border:2px solid var(--ink);border-radius:9px;padding:3px 10px;font-size:12px;font-weight:700}
.center{text-align:center}
.ticket{background:#fff8ee;border:3px dashed var(--ink);border-radius:20px;padding:18px;margin:20px 0 12px;position:relative}
.ticket:before,.ticket:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--cream);border:2px solid var(--ink);top:calc(50% - 12px)}
.ticket:before{right:-14px}.ticket:after{left:-14px}
.ticket-title{text-align:center;font-size:23px;font-weight:800;margin-bottom:4px}
.ticket-sub{text-align:center;font-size:12px;color:#786d7e;margin-bottom:15px}
.ticket-row{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed #b9a9b4;padding:10px 0;font-size:14px}
.ticket-row strong{max-width:65%;text-align:left}
.final-note{background:var(--yellow);border:2px solid var(--ink);border-radius:13px;padding:12px;text-align:center;font-weight:700;line-height:1.8;margin:12px 0}
.footer{text-align:center;color:#867a88;font-size:11px;margin-top:18px}
.tiny-heart{position:absolute;font-size:22px;opacity:.45}
@media(max-width:390px){.card{padding:21px 16px}.options{gap:9px}.option{font-size:14px;min-height:85px}}

.yesno{position:relative;display:flex;flex-direction:column;gap:12px;max-width:330px;margin:20px auto 12px}.runaway{transition:left .13s,top .13s;z-index:2}.invite-card{background:linear-gradient(145deg,#fff4f7,#fff9e9);border:3px solid var(--ink);border-radius:22px;padding:22px 19px;margin:16px 0 18px;box-shadow:5px 5px 0 var(--pink);text-align:center;position:relative}.invite-decor{color:#d65c87;font-size:19px;font-weight:800;letter-spacing:3px}.invite-heading{font-size:25px;font-weight:800;margin:8px 0 16px;color:#b43f6a}.invite-body{font-size:16px;line-height:2.05;text-align:right;white-space:normal}.invite-card .invite-decor:last-child{margin-top:14px;font-size:15px;letter-spacing:0}
@media print{body{background:white}.wrap{width:100%;padding:0;display:block}.card{border:0;box-shadow:none;max-width:100%;padding:8px;animation:none}.topline,.footer,.progress,.btn,.heart,.sub,.question-tag{display:none!important}.ticket{break-inside:avoid}.invite-card{box-shadow:none;break-inside:avoid;border:2px solid #333;margin-top:10px}.invite-heading{color:#8e3155}}

</style>
</head>
<body>
<div class="wrap"><main class="card" id="app" aria-live="polite"></main></div>
<script>
const app = document.getElementById('app');
const state = {day:'بكرا',place:'عشاء بمطعم ولفة بالسيارة',food:'برجر (عند المطعم الي جربناه مع بعض 🌝)',time:'الساعة ٨:٠٠ مساءً'};
let step = -1;
const questions = [
 {key:'day',tag:'خطة الموعد ١ من ٤',title:'متى بدنا نطلع يا روحي؟',sub:'خير البرّ عاجله 🌝',emoji:'📅',options:[['🌝','بكرا','good'],['⏳','الأسبوع الجاي','bad'],['🙃','بنشوف بعدين','bad']]},
 {key:'place',tag:'خطة الموعد ٢ من ٤',title:'وين بدك تاخدني؟',sub:'اختيار المكان مسؤولية وطنية 😂❤️',emoji:'🚗',options:[['🍽️','عشاء بمطعم ولفة بالسيارة','good'],['🛋️','نضل بالبيت','bad'],['🏪','نجيب أكل ونرجع','bad']]},
 {key:'food',tag:'خطة الموعد ٣ من ٤',title:'شو بتحبّي تتعشي؟',sub:'تلميح صغير: إحنا مجرّبينه سوا 🌝',emoji:'🍔',options:[['🍔','برجر (عند المطعم الي جربناه مع بعض 🌝)','good'],['🍕','بيتزا','bad'],['🥗','سلطة وخلاص','bad']]},
 {key:'time',tag:'خطة الموعد ٤ من ٤',title:'أيّة ساعة يا حلو؟',sub:'الالتزام بالموعد من أساسيات الرومانسية 💌',emoji:'🕗',options:[['🕗','الساعة ٨:٠٠ مساءً','good'],['🕕','الساعة ٦:٠٠ المسا','bad'],['🌙','على وقت ما نفضى','bad']]}
];
const rejection = [
 ['🚨 تم رفض الطلب من قِبل المديرية العامة للرومانسية','محاولة التهرّب من الموعد مرصودة… اختار جوابًا يليق بالمناسبة 😂❤️'],
 ['📅 تم رفض الطلب من قِبل المديرية العامة للرومانسية','خير البرّ عاجله، والتأجيل مش داخل ضمن صلاحياتك 🌝'],
 ['🚗 تم رفض الطلب من قِبل المديرية العامة للرومانسية','المديرية مصرّة على عشاء ولفة بالسيارة… حاول مرة ثانية 😂'],
 ['🍔 تم رفض الطلب من قِبل المديرية العامة للرومانسية','القرار الغذائي محسوم من الإدارة العليا: برجر! 🌝'],
 ['🕗 تم رفض الطلب من قِبل المديرية العامة للرومانسية','الساعة ٨ المسا، لا بكير ولا متأخر… قرار نهائي 😂']
];
function header(){return `<div class="topline"><span class="stamp">💌 تصريح موعد رسمي</span><span class="mini">وزارة الطلعات والشؤون الزوجية</span></div>`}
function renderIntro(){step=-1;app.innerHTML=`${header()}<div class="heart">💗</div><h1>وزارة الطلعات<br>والشؤون الزوجية</h1><p class="sub">إلى الزوج الحبيب: في طلب رسمي لعزومة زوجتك الحلوة على موعد خاصّ… يرجى الإجابة بكل أمانة، علمًا بأن المديرية تراقب تحركاتك 🌝</p><button class="btn primary" onclick="start()">فتح الطلب الرسمي 💌</button><div class="footer">الرومانسية مسؤولية مشتركة… بس اليوم الدور عليك 😂❤️</div>`}
function start(){step=0;renderYesNo()}
function renderYesNo(){
 app.innerHTML=`${header()}<div class="heart">🥹💗</div><h1>حاب تعزمني على موعد خاصّ، صح؟</h1><p class="sub">سؤال بسيط جدًا… والإجابة الصحيحة معروفة مسبقًا 🌝</p><div class="yesno"><button class="btn primary" onclick="acceptYes()">نعم طبعًا يا روحي ❤️</button><button id="noBtn" class="btn secondary runaway" onpointerenter="runAway()" onclick="runAway()">لا 🙄</button></div><div id="notice" class="notice"></div><div class="footer">ملاحظة: زر «لا» عنده خوف من الالتزام 😂</div>`;
 const no=document.getElementById('noBtn'); no.addEventListener('touchstart',runAway,{passive:true});
}
function runAway(){const b=document.getElementById('noBtn');if(!b)return;const box=b.parentElement.getBoundingClientRect();const maxX=Math.max(0,box.width-b.offsetWidth);b.style.position='relative';b.style.left=(Math.random()*Math.min(maxX,160)-Math.min(maxX,160)/2)+'px';b.style.top=(Math.random()*70-35)+'px';const n=document.getElementById('notice');n.innerHTML='🚨 تم رفض الطلب من قِبل المديرية العامة للرومانسية 😂<br>حتى زر «لا» مش موافق معك! جرّب «نعم» يا حبيبي ❤️';n.classList.add('show')}
function acceptYes(){step=0;renderQuestion()}
function renderQuestion(){const q=questions[step];app.innerHTML=`${header()}<div class="progress">${questions.map((x,i)=>`<span class="${i<=step?'active':''}"></span>`).join('')}</div><div class="center" style="margin-top:18px"><span class="question-tag">${q.tag}</span></div><div class="heart" style="font-size:49px;margin:10px auto 0">${q.emoji}</div><h2>${q.title}</h2><p class="sub">${q.sub}</p><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="choose(${i},this)"><span class="emoji">${o[0]}</span><span>${o[1]}</span></button>`).join('')}</div><div id="notice" class="notice"></div><button id="next" class="btn primary" style="display:none" onclick="next()">${step===questions.length-1?'إصدار التصريح النهائي 🎟️':'موافقة الإدارة؟ كمّل 💗'}</button><div class="footer">كل الخيارات تخضع لموافقة المديرية العامة للرومانسية 🌝</div>`}
function choose(i,el){const q=questions[step],o=q.options[i];document.querySelectorAll('.option').forEach(b=>b.classList.remove('good','bad'));const note=document.getElementById('notice');if(o[2]!=='good'){el.classList.add('bad');const r=rejection[step+1];note.innerHTML=`<strong>${r[0]}</strong><br>${r[1]}`;note.classList.add('show');document.getElementById('next').style.display='none';return}el.classList.add('good');state[q.key]=o[1];note.innerHTML='✅ اختيار معتمد رسميًا… هيك الحكي ولا بلاش! 💗';note.classList.add('show');document.getElementById('next').style.display='block'}
function next(){if(!state[questions[step].key])return;if(step<questions.length-1){step++;renderQuestion()}else renderFinal()}
const invite=`حبيبتي ❤️\n\nأنا بعزمك بكرا عالمطعم الي اكلنا فيه برجر بيوم ميلادك الساعة 8:00 المسا.\n\nوبشهد إني اخترت كل هالقرارات بإرادتي الحرة تماماً، وما حدا أجبرني على شيء 😂❤️\n\nجهّزي حالك، بحبّك كثير💕`;
function renderFinal(){app.innerHTML=`${header()}<div class="heart">🎟️</div><h1>تمت الموافقة يا حبيبي! 💗</h1><p class="sub">بعد مراجعة دقيقة، أصدرت المديرية التصريح الرسمي للموعد الرومانسي.</p><div class="ticket"><div class="ticket-title">تصريح موعد رومانسي 💌</div><div class="ticket-sub">صادر عن وزارة الطلعات والشؤون الزوجية</div><div class="ticket-row"><span>📅 الموعد</span><strong>بكرا</strong></div><div class="ticket-row"><span>📍 الخطة</span><strong>عشاء بمطعم ولفة بالسيارة</strong></div><div class="ticket-row"><span>🍔 العشاء</span><strong>برجر عند المطعم الي جربناه مع بعض 🌝</strong></div><div class="ticket-row"><span>🕗 الساعة</span><strong>٨:٠٠ مساءً</strong></div><div class="final-note">وبهيك تم اعتماد كل القرارات بإرادته الحرة تمامًا… حسب إفادته الرسمية 😂❤️</div></div><h2 style="font-size:23px">وجهّزنالك دعوة ترسلها لزوجتك الحلوة 💕</h2><p class="sub">انسخ النص الجاهز أو احفظ بطاقة الدعوة وابعثها إلها.</p><div class="invite-card" id="inviteCard"><div class="invite-decor">♥ ✦ ♥</div><div class="invite-heading">دعوة من القلب</div><div class="invite-body">حبيبتي ❤️<br><br>أنا بعزمك بكرا عالمطعم الي اكلنا فيه برجر بيوم ميلادك الساعة 8:00 المسا.<br><br>وبشهد إني اخترت كل هالقرارات بإرادتي الحرة تماماً، وما حدا أجبرني على شيء 😂❤️<br><br>جهّزي حالك، بحبّك كثير💕</div><div class="invite-decor">♡ موعدنا بكرا ♡</div></div><button class="btn primary" onclick="copyInvite()">📋 انسخ الدعوة الجاهزة</button><button class="btn secondary" onclick="window.print()">💌 احفظ البطاقة / اطبعها PDF</button><div id="copyNotice" class="notice"></div><button class="btn secondary" onclick="restart()">نعيد الطلب من الأول 🔄</button><div class="footer">تمت الموافقة بحبّ شديد 💗</div>`}
async function copyInvite(){try{await navigator.clipboard.writeText(invite);showCopy('انسخت الدعوة! ابعثها لحبيبتك هسا ❤️')}catch(e){const ta=document.createElement('textarea');ta.value=invite;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showCopy('انسخت الدعوة! ❤️')}}
function showCopy(t){const n=document.getElementById('copyNotice');n.textContent=t;n.classList.add('show')}
function restart(){state.day='بكرا';state.place='عشاء بمطعم ولفة بالسيارة';state.food='برجر (عند المطعم الي جربناه مع بعض 🌝)';state.time='الساعة ٨:٠٠ مساءً';renderIntro()}
renderIntro();
</script>
</body>
</html>

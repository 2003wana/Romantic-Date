<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a32">
<title>مشوار وحكي من القلب ❤️</title>
<style>
:root{--night:#171a32;--night2:#292844;--cream:#fff6e8;--paper:#f7e7cd;--ink:#4b3029;--rose:#e98c91;--pink:#ffd0d0;--gold:#d8ad70;--red:#a83d50;--muted:#76645e;--shadow:0 18px 50px #080a1c66}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:20px 12px calc(24px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#403652 0%,var(--night) 55%,#0d1020 100%);overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.65;background-image:radial-gradient(2px 2px at 15% 22%,#fff 50%,transparent 60%),radial-gradient(1.5px 1.5px at 77% 18%,#ffe3b8 50%,transparent 60%),radial-gradient(2px 2px at 84% 68%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 30% 79%,#ffe3b8 50%,transparent 60%),radial-gradient(1px 1px at 55% 42%,#fff 50%,transparent 60%);background-size:210px 190px,260px 230px,290px 270px,230px 220px,180px 210px;z-index:-1}
.wrap{width:min(100%,560px);margin:0 auto;min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center}.card{width:100%;position:relative;overflow:hidden;border:1px solid #f4d9b96e;border-radius:26px;padding:clamp(22px,6vw,36px);background:linear-gradient(145deg,#fff8ec 0%,#f4e3c8 100%);color:var(--ink);box-shadow:var(--shadow);animation:appear .45s ease both}.card:before{content:"✦  ·  ✧  ·  ✦";display:block;text-align:center;color:#b78359;letter-spacing:8px;font-size:13px;margin-bottom:16px}.eyebrow{text-align:center;color:#9a6258;font-size:.82rem;letter-spacing:1px;margin:0 0 10px}.title{text-align:center;font-size:clamp(1.7rem,7vw,2.25rem);line-height:1.35;margin:0 0 14px;color:#392b36}.intro{text-align:center;line-height:2;font-size:1.04rem;white-space:pre-line;margin:0 auto 22px;max-width:430px}.envelope{width:126px;height:88px;margin:10px auto 20px;position:relative;background:#d9a879;border-radius:8px;box-shadow:0 8px 18px #75452d30;display:grid;place-items:center;color:#8c3f4e;font-size:35px}.envelope:before{content:"";position:absolute;top:0;left:0;right:0;margin:auto;width:0;height:0;border-left:63px solid transparent;border-right:63px solid transparent;border-top:47px solid #f0c99d;filter:drop-shadow(0 2px 1px #9e6840)}.envelope span{position:relative;z-index:1;margin-top:20px}.btn{appearance:none;border:0;border-radius:15px;padding:14px 18px;font:inherit;font-weight:750;font-size:1rem;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s;touch-action:manipulation}.btn:active{transform:scale(.98)}.primary{display:block;width:100%;color:#fff9f2;background:linear-gradient(135deg,#9f4354,#c96576);box-shadow:0 8px 18px #9f43542c}.primary:hover{filter:brightness(1.06)}.choices{display:grid;gap:10px;margin-top:22px}.choice{width:100%;text-align:right;background:#fffaf2;color:#563a33;border:1px solid #e8cfb1;box-shadow:0 3px 0 #ead5b8;padding:14px 15px;border-radius:14px;line-height:1.5}.choice:hover{border-color:#c17b7e;background:#fff2ee}.choice:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b76b79;outline-offset:3px}.question{font-size:clamp(1.35rem,5.6vw,1.7rem);line-height:1.55;text-align:center;margin:0;color:#392b36}.sub{text-align:center;color:var(--muted);font-size:.91rem;margin:8px 0 0;line-height:1.7}.field{display:block;width:100%;margin-top:10px;padding:13px 14px;border:1px solid #d9bfa1;border-radius:12px;background:#fffdf8;color:#402d2a;font:inherit;font-size:1rem}.field-label{display:block;margin:18px 0 6px;font-weight:700;color:#67433c}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.row .btn{width:100%}.secondary{background:#e8d4b8;color:#553b35}.tiny{font-size:.82rem;color:#816d63;text-align:center;margin-top:16px;line-height:1.7}.shake{animation:shake .38s ease}.message{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.7;font-weight:750;color:#9e3f53;margin:14px 0 0}.badge{display:inline-block;border:1px solid #d6ad7c;border-radius:100px;padding:6px 13px;color:#8e5d4e;font-size:.82rem;margin-bottom:12px}.certificate{background:#fff7e8;border:5px double #bd925c;padding:clamp(18px,5vw,28px);position:relative}.certificate:after{content:"✦";position:absolute;top:9px;left:12px;color:#bd925c;font-size:22px}.cert-head{text-align:center;border-bottom:1px solid #d8b98f;padding-bottom:15px;margin-bottom:17px}.cert-head h2{font-size:1.12rem;line-height:1.8;margin:0;color:#6b4039}.cert-head p{margin:3px 0 0;color:#9c655c}.cert-title{text-align:center;font-size:1.45rem;line-height:1.5;margin:12px 0 20px;color:#56343a}.details{display:grid;gap:9px;margin:0 0 20px}.detail{background:#f6e8d2;border-radius:10px;padding:10px 12px;line-height:1.7}.detail strong{color:#8e4a51}.letter{line-height:2.05;white-space:pre-line;font-size:.98rem}.stamp{width:116px;height:116px;border:3px solid #a74756;border-radius:50%;color:#a74756;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:850;line-height:1.5;transform:rotate(-12deg);margin:24px auto 12px;padding:12px;font-size:.87rem;box-shadow:inset 0 0 0 3px #a7475633}.signature{border-top:1px dashed #c7a77f;padding-top:13px;margin-top:20px;text-align:left;color:#754a42;line-height:1.8}.ending{text-align:center;line-height:1.9;font-weight:800;color:#8f4351;margin:18px 0 0}.hidden{display:none!important}.footer{text-align:center;color:#d9c5c4;font-size:.78rem;margin-top:16px;opacity:.8}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(7px)}50%{transform:translateX(-7px)}75%{transform:translateX(5px)}}
@media(min-width:600px){body{padding-top:32px;padding-bottom:32px}.card{padding:36px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="wrap"><section class="card" id="app" aria-live="polite">
  <div class="envelope" aria-hidden="true"><span>♥</span></div>
  <p class="eyebrow">دعوة خاصة لشخص مميز جدًا</p>
  <h1 class="title">مشوار وحكي من القلب ❤️</h1>
  <p class="intro">مرحبًا يا روحي ❤️

هالموقع مش بس أسئلة… هو بداية لموعد حلو، وجلسة مليانة حب وضحك، فإنت مستعد؟ 🌙</p>
  <button class="btn primary" id="openInvite">افتح دعوتك يا حبيبي 💌</button>
  <p class="tiny">تنبيه من المديرية العامة للرومانسية: يُرجى الإجابة بكل حب 😂</p>
</section></main>
<div class="footer">صُنع بكل الحب ❤️</div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const data={schedule:'',destination:'',food:'',customFood:'',time:'',customTime:'',extraChoice:'',note:''};
const noMessages=['تم رفض الطلب من قِبل المديرية العامة للرومانسية 😂❤️','عذرًا، خيار «لأ» غير متاح في هذه المعاملة الرومانسية 😌','يرجى إعادة المحاولة بعد جرعة إضافية من الحب 😂💕'];
let noCount=0;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shell(content){app.classList.remove('shake');app.innerHTML=content;window.scrollTo({top:0,behavior:'smooth'});}
function question(title,sub=''){return `<p class="eyebrow">محضر موعد رومانسي رقم ٠٠١ ❤️</p><h1 class="question">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`;}
function choiceButtons(items){return `<div class="choices">${items.map((x,i)=>`<button class="btn choice" data-choice="${i}">${x}</button>`).join('')}</div>`;}
function bindChoices(items,handler){app.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>handler(Number(btn.dataset.choice),items[Number(btn.dataset.choice)])));}
function goSchedule(){
 const items=['❤️ اليوم المسا.','🥰 بكرا المسا.','🌝 عَ فضاوة وروقان.','🏠 بلا ما نطلع، منضل بالبيت.'];
 shell(question('متى بدنا نطلع يا روحي؟ 🌙')+choiceButtons(items));
 bindChoices(items,(i,v)=>{if(i<2){data.schedule=v;goDestination();}else{shell(question('قرار مرفوض مؤقتًا يا روحي 😂❤️')+`<p class="intro">${i===3?'البيت رح يضل موجود بكرا، أما موعدنا إله أولوية! 😂❤️':'الفضاوة حلوة، بس خلّينا نحدّد موعد ونعيش اللحظة سوا! 😏❤️'}</p><button class="btn primary" id="tryAgain">حاضر، خلّينا نختار موعدًا ❤️</button>`);document.getElementById('tryAgain').onclick=goSchedule;}});
}
function goDestination(){
 const items=['🍔 عشاء بمطعم ولفة بالسيارة.','☕ كافيه وقعدة حلوة.','🚗 نجيب إشي طيب ونطلع نتمشى بالسيارة.','🎁 مفاجأة من اختيارك.'];
 shell(question('وين بدك تاخدني يا روحي؟ ❤️')+choiceButtons(items));
 bindChoices(items,(i,v)=>{data.destination=v;if(i===3){goSurprise();}else{goFood(i);}});
}
function goFood(type){
 let title='',items=[];
 if(type===0){title='طيب يا روحي، شو بتحب نتعشّى؟ 🍽️❤️';items=['برجر من المطعم اللي جرّبناه مع بعض بيوم ميلادك 🌝❤️','بيتزا.','وجبة دجاج.','سوشي.','شاورما.','إشي من اختيارك.'];}
 if(type===1){title='طيب يا روحي، شو عبالك نطلب بالكافيه؟ ☕🤎';items=['قهوة وحلو.','بان كيك أو وافل.','تشيز كيك أو قطعة كيك.','كوكتيل أو عصير.','إشي من اختيارك.'];}
 if(type===2){title='طيب يا روحي، شو بدك نجيب معنا للمشوار؟ 🚗🌙';items=['برجر.','شاورما.','بطاطا ومقبلات.','مشروب بارد مع سناك.','بيتزا.','إشي من اختيارك.'];}
 shell(question(title)+choiceButtons(items));
 bindChoices(items,(i,v)=>{if(v==='إشي من اختيارك.'){showCustomFood();}else{data.food=v;goTime();}});
}
function showCustomFood(){shell(question('شو الإشي اللي ببالك؟ 😋❤️')+`<label class="field-label" for="customFood">اكتب اختيارك هون</label><input class="field" id="customFood" maxlength="140" placeholder="مثلاً: أكلة نفسي فيها…"><div class="row"><button class="btn secondary" id="backFood">رجوع</button><button class="btn primary" id="saveFood">نكمل ❤️</button></div><p class="message" id="msg"></p>`);document.getElementById('backFood').onclick=goDestination;document.getElementById('saveFood').onclick=()=>{let v=document.getElementById('customFood').value.trim();if(!v){document.getElementById('msg').textContent='اكتب شو بدك يا روحي، عشان نوثّق الطلب رسميًا 😄';return;}data.food='إشي من اختيارك';data.customFood=v;goTime();};}
function goSurprise(){shell(question('يا سلام على المفاجآت! 🎁❤️')+`<p class="intro">بما إنك اخترت مفاجأة، معناتك لسا متذكّر إنه حبيبتك بتحبّ المفاجآت، وحابب تعمللها يوم غير شكل ❤️‍🔥</p><button class="btn primary" id="next">نكمل ونحدّد الوقت 🕰️</button>`);document.getElementById('next').onclick=goTime;}
function goTime(){const items=['٦ المسا.','٧ المسا.','٨ المسا.','٩ المسا.','الوقت اللي بتختاره إنت.'];shell(question('طيب يا روحي، أي ساعة بتناسبك؟ 🕰️❤️')+choiceButtons(items));bindChoices(items,(i,v)=>{if(i===4){customTimeForm();}else{data.time=v;goExtra();}});}
function customTimeForm(){shell(question('أي ساعة بتختار يا روحي؟ 🕰️')+`<label class="field-label" for="customTime">اكتب الوقت المناسب إلك</label><input class="field" id="customTime" maxlength="80" placeholder="مثلاً: بعد الساعة ٨ ونص"><div class="row"><button class="btn secondary" id="backTime">رجوع</button><button class="btn primary" id="saveTime">نكمل ❤️</button></div><p class="message" id="msg"></p>`);document.getElementById('backTime').onclick=goTime;document.getElementById('saveTime').onclick=()=>{let v=document.getElementById('customTime').value.trim();if(!v){document.getElementById('msg').textContent='اكتب الوقت اللي بناسبك يا حبيبي ❤️';return;}data.time='وقت يحدده صاحب التصريح';data.customTime=v;goExtra();};}
function goExtra(){const items=['لا، هيك موعدنا كامل!','عندي لمسة خاصة لحبيبتي.','خليها مفاجأة!'];shell(question('قبل ما نكمل… عندك إشي أخير حاب تضيفه لموعدنا؟ 😏❤️')+choiceButtons(items)+`<label class="field-label" for="note">ملاحظة إضافية (اختياري) 💌</label><textarea class="field" id="note" rows="3" maxlength="500" placeholder="إذا عندك أي تفصيل حاب تضيفه، اكتبه هون…"></textarea><button class="btn primary" id="finish" style="margin-top:16px">إصدار التصريح الرسمي 📜❤️</button><p class="message" id="msg"></p>`);let selected='';bindChoices(items,(i,v)=>{selected=v;data.extraChoice=v;app.querySelectorAll('[data-choice]').forEach((b,j)=>{b.style.borderColor=j===i?'#b65f70':'#e8cfb1';b.style.background=j===i?'#fce5e3':'#fffaf2';});});document.getElementById('finish').onclick=()=>{if(!selected){document.getElementById('msg').textContent='اختار اللمسة الأخيرة يا روحي، وكل الخيارات مقبولة ❤️';return;}data.note=document.getElementById('note').value.trim();goEnvelope();};}
function goEnvelope(){shell(question('كل الاختيارات صارت جاهزة… 💌')+`<p class="intro">اضغط على الظرف ليفتح التصريح الرومانسي الرسمي الخاص فيكم ❤️</p><button class="envelope" id="openCert" style="border:0;cursor:pointer;width:150px;height:105px" aria-label="افتح التصريح"><span>♥</span></button><button class="btn primary" id="openCert2">افتح التصريح الرسمي 📜</button>`);document.getElementById('openCert').onclick=certificate;document.getElementById('openCert2').onclick=certificate;}
function detail(label,value){if(!value)return '';return `<div class="detail"><strong>${label}:</strong> ${esc(value)}</div>`;}
function certificate(){let food='';if(data.food){food=data.food==='إشي من اختيارك'?(data.customFood?`إشي من اختياري: ${data.customFood}`:'إشي من اختياري'):data.food;}
let details=detail('موعد الخروج',data.schedule)+detail('الوجهة',data.destination)+detail('الطعام / الطلب',food)+detail('الوقت',data.customTime?data.customTime:data.time)+detail('الإضافة الأخيرة',data.extraChoice)+detail('ملاحظة صاحب التصريح',data.note);
shell(`<div class="certificate"><div class="cert-head"><h2>المديرية العامة للرومانسية<br>قسم المواعيد واللحظات الجميلة ❤️</h2><p>وثيقة رسمية لا تُقدّر بثمن</p></div><span class="badge">تصريح رقم: 001 — معاملة حبّ</span><h1 class="cert-title">تصريح رسمي لمشوار وحكي من القلب</h1><div class="details">${details||'<div class="detail">تم تسجيل اختيارات الموعد ❤️</div>'}</div><div class="letter">حبيبتي ❤️

أنا بعزمك على موعد خاص، نغيّر فيه جو، وننبسط مع بعض، ونسرق إلنا شويّة وقت بعيد عن دوشة الأيام.

وبشهد إني اخترت هالقرارات بإرادتي الحرة تمامًا، وما حدا أجبرني على أي إشي 😂❤️

جهّزي حالك لأمسية حلوة مع بعض، فيها ضحك وحكي من القلب وذكريات جديدة.

بحبّك كثير 💕</div><div class="stamp">تمت<br>الموافقة<br>بكل حب ❤️</div><p class="letter">تمت الموافقة على الطلب بنجاح، ويُمنح صاحب التصريح إذنًا رسميًا بالخروج في موعد رومانسي مع زوجته الحلوة، مع الالتزام بكافة قوانين الدلال والرومانسية 😂❤️</p><div class="signature">التوقيع: زوجك المحبّ ❤️<br>الختم: المديرية العامة للرومانسية</div><p class="ending">تم حجز الموعد بنجاح، بانتظار أجمل طلعة مع أجمل حبيبة ❤️🌙</p></div><button class="btn primary" id="again" style="margin-top:16px">إعادة التجربة من البداية 💌</button><p class="tiny">خلي التصريح ذكرى حلوة، أو خذ لقطة شاشة واحتفظ فيها ❤️</p>`);document.getElementById('again').onclick=()=>{Object.keys(data).forEach(k=>data[k]='');noCount=0;shell(`<div class="envelope" aria-hidden="true"><span>♥</span></div><p class="eyebrow">دعوة خاصة لشخص مميز جدًا</p><h1 class="title">مشوار وحكي من القلب ❤️</h1><p class="intro">مرحبًا يا روحي ❤️

هالموقع مش بس أسئلة… هو بداية لموعد حلو، وجلسة مليانة حب وضحك، فإنت مستعد؟ 🌙</p><button class="btn primary" id="openInvite">افتح دعوتك يا حبيبي 💌</button><p class="tiny">تنبيه من المديرية العامة للرومانسية: يُرجى الإجابة بكل حب 😂</p>`);document.getElementById('openInvite').onclick=goConsent;};}
function goConsent(){const items=['أكيد، من عيوني!','لأ'];shell(question('حاب تعزمني عَ موعد خاصّ، صح؟ 😏❤️')+choiceButtons(items)+`<p class="message" id="msg"></p>`);bindChoices(items,(i)=>{if(i===0){goSchedule();}else{noCount++;app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');const msg=noMessages[(noCount-1)%noMessages.length];document.getElementById('msg').textContent=msg;const noBtn=app.querySelector('[data-choice="1"]');if(noBtn){noBtn.style.transform=`translateX(${noCount%2?8:-8}px)`;setTimeout(()=>{if(noBtn.isConnected)noBtn.style.transform='';},250);}}});}
document.getElementById('openInvite').addEventListener('click',goConsent);
})();
</script>
</body>
</html>

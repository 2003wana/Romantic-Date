<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#171a32">
<title>مشوار وحكي من القلب ❤️</title>
<style>
:root{--night:#171a32;--night2:#292844;--cream:#fff5e5;--paper:#f7e7cd;--ink:#4c3027;--rose:#e98c91;--rose2:#ffd1c9;--gold:#d8ad70}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at top,#35304c 0,#171a32 55%,#101223 100%);color:var(--cream);min-height:100vh;overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 70% 20%,#ffd9b3 50%,transparent 55%),radial-gradient(2px 2px at 80% 70%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 35% 80%,#ffd9b3 50%,transparent 55%);background-size:190px 170px,240px 230px,280px 250px,220px 200px;z-index:-1}.wrap{width:min(100% - 28px,650px);margin:0 auto;padding:28px 0 45px}.brand{text-align:center;color:#ffd7cb;font-size:.9rem;letter-spacing:.04em;margin-bottom:18px}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,245,229,.99),rgba(247,231,205,.98));color:var(--ink);border:1px solid #e8c99f;border-radius:28px;padding:clamp(22px,5vw,38px);box-shadow:0 22px 60px #08091780, inset 0 0 0 5px #fff6e355;animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}.card:before{content:'✦';position:absolute;top:12px;left:17px;color:#d8ad70;font-size:1.5rem;opacity:.8;animation:twinkle 2s ease-in-out infinite}.card:after{content:'♡';position:absolute;bottom:6px;right:15px;color:#e98c9166;font-size:3rem;pointer-events:none;transform:rotate(-15deg)}.hidden{display:none!important}.moon{font-size:2.2rem}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.75rem;color:#93664d;font-weight:800}.card h1,.card h2{line-height:1.4;margin:.45rem 0 1rem}.card h1{font-size:clamp(1.7rem,5vw,2.35rem)}.card h2{font-size:clamp(1.35rem,4vw,1.8rem)}p{line-height:1.9}.muted{color:#7c6254}.actions{display:grid;gap:11px;margin-top:24px}.choice,.primary,.secondary{font:inherit;font-weight:750;border-radius:17px;padding:14px 16px;min-height:52px;border:1px solid #ddc2a3;background:linear-gradient(135deg,#fffdf7,#fff4e5);color:var(--ink);cursor:pointer;text-align:right;transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .2s;width:100%;box-shadow:0 5px 0 #d8bd9f55,0 8px 18px #6b45300c;position:relative;z-index:1}.choice:hover,.choice:focus-visible{border-color:var(--rose);background:#fff0eb;outline:2px solid #e98c9155;transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 0 #e98c9130,0 14px 22px #6b453015}.choice:active,.primary:active{transform:scale(.97)}.primary{background:var(--rose);color:#351d26;border:0;text-align:center}.secondary{text-align:center;background:transparent}.choice .sub{display:block;font-weight:400;font-size:.83rem;color:#85695a;margin-top:3px}.note{margin-top:18px;padding:12px 14px;border-right:4px solid var(--rose);background:#fbe6dc;border-radius:10px;line-height:1.7;font-size:.92rem}.seal{display:inline-grid;place-items:center;border:2px solid #a54d4d;color:#a54d4d;border-radius:50%;width:86px;height:86px;text-align:center;font-size:.75rem;font-weight:900;transform:rotate(-10deg);margin:4px}.envelope{font-size:4rem;display:block;text-align:center;animation:float 2.5s ease-in-out infinite}.letter{position:relative;background:linear-gradient(145deg,#fffaf0,#fff0d9);border:1px solid #d9b886;padding:clamp(18px,4vw,28px);border-radius:12px;box-shadow:inset 0 0 0 5px #f3e0c2,0 12px 28px #76503918;margin-top:18px}.letter:before{content:'✧  ♥  ✧';display:block;text-align:center;color:#b77966;letter-spacing:.35em;margin-bottom:10px}.letter h2{text-align:center;color:#7e3f3c}.letter .rule{border-top:1px dashed #c9a27b;margin:12px 0}.detail{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #ddc3a2}.detail span:first-child{color:#87654f;font-weight:700}.detail span:last-child{text-align:left;overflow-wrap:anywhere}.closing{text-align:center;color:#ffdbce;margin-top:25px;line-height:1.9}.toast{margin-top:15px;padding:12px;border-radius:12px;background:#f9dcd4;color:#752d39;font-weight:700;text-align:center;animation:rise .25s ease}.tiny{text-align:center;font-size:.82rem;color:#8d6d59;margin-top:18px}.page-flash{animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #d8b99b;background:#fffaf2;font:inherit;font-size:16px;color:var(--ink);margin-top:8px}.heart{color:#bb535e}.footer{text-align:center;color:#d6c3c5;font-size:.8rem;margin-top:22px}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes pageIn{0%{opacity:0;transform:translateY(18px) scale(.975) rotateX(2deg);filter:blur(3px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes twinkle{0%,100%{transform:scale(.85) rotate(0);opacity:.45}50%{transform:scale(1.18) rotate(18deg);opacity:1}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes drift{0%{transform:translateY(15px) rotate(-8deg);opacity:0}20%{opacity:.9}100%{transform:translateY(-85vh) rotate(20deg);opacity:0}}.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}.floaty{position:absolute;bottom:-35px;animation:drift var(--dur,8s) linear forwards;font-size:var(--size,20px);opacity:0;filter:drop-shadow(0 2px 5px #0002)}.choice{animation:pop .35s ease both}.choice:nth-child(2){animation-delay:.035s}.choice:nth-child(3){animation-delay:.07s}.choice:nth-child(4){animation-delay:.105s}.choice:nth-child(5){animation-delay:.14s}.choice:nth-child(6){animation-delay:.175s}.invite-promo{margin-top:20px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#f8dfcf,#fff4df);border:1px dashed #c99672;text-align:center;line-height:1.8}.invite-actions{display:grid;gap:10px;margin-top:12px}.primary{box-shadow:0 5px 0 #b85f6855,0 10px 20px #8d3c4c18}.no-zone{position:relative;min-height:80px;display:flex;align-items:center;justify-content:center;margin-top:12px}.no-runner{width:auto;min-width:110px;max-width:75%;text-align:center;transition:left .18s ease,top .18s ease,transform .18s ease;z-index:4}.sparkle{display:inline-block;animation:twinkle 1.7s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(min-width:560px){.actions.two{grid-template-columns:1fr 1fr}.actions.two .choice{height:100%}}
</style></head><body><div class="stars"></div><div class="floaties" id="floaties" aria-hidden="true"></div><main class="wrap"><div class="brand">☾ ✦ المديرية العامة للرومانسية ✦ ☾</div><section id="screen" class="card" aria-live="polite"></section><div class="closing">صُنعت بكل حبّ، لحبيبتك المفضّلة <span class="heart">♥</span></div><div class="footer">تصريح رسمي للمشاعر الجميلة 😂❤️</div></main>
<script>
(()=>{const root=document.getElementById('screen');const state={day:'',destination:'',food:'',time:'',extra:''};let noCount=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function burstHearts(){const box=document.getElementById('floaties');if(!box)return;const bits=['💗','💕','✨','💖','🌸','♥'];for(let i=0;i<9;i++){const el=document.createElement('span');el.className='floaty';el.textContent=bits[Math.floor(Math.random()*bits.length)];el.style.left=(4+Math.random()*92)+'%';el.style.setProperty('--dur',(5+Math.random()*4)+'s');el.style.setProperty('--size',(16+Math.random()*20)+'px');el.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(el);setTimeout(()=>el.remove(),10000)}}function render(html){root.classList.remove('page-flash');void root.offsetWidth;root.innerHTML=html;root.classList.add('page-flash');root.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}function buttons(items,fn){return `<div class="actions">${items.map((x,i)=>`<button class="choice" type="button" data-i="${i}">${x.label||x}</button>`).join('')}</div>`}function showWelcome(){render(`<div class="moon">🌙 💌</div><div class="eyebrow">دعوة سرّية لشخص مميّز</div><h1>مرحبًا يا روحي ❤️</h1><p>هالموقع مش بس أسئلة...<br>هو بداية لموعد حلو،<br>وجلسة مليانة حب وضحك،<br>فأنت مستعد؟</p><button class="primary" id="start">يلا نبدأ ♥</button>`);root.querySelector('#start').onclick=showQ1}function showQ1(){render(`<div class="moon">💘✨</div><div class="eyebrow">السؤال الأول · فحص الجاهزية</div><h2>حاب تعزمني عَ موعد خاصّ، صح؟ 😏❤️</h2><p class="muted">اختار جوابك بكل صراحة… إذا قدرت تمسك زر «لا» أصلًا 😂</p><div class="actions"><button class="choice" id="yes">😍 أكيد، من عيوني!</button></div><div class="no-zone" id="noZone"><button class="choice no-runner" id="no">🙈 لا</button></div><div id="msg" aria-live="polite"></div>`);root.querySelector('#yes').onclick=()=>{burstHearts();showDay()};const b=root.querySelector('#no'),zone=root.querySelector('#noZone');function flee(e){if(e)e.preventDefault();noCount++;const maxX=Math.max(0,zone.clientWidth-b.offsetWidth),maxY=Math.max(0,zone.clientHeight-b.offsetHeight);b.style.position='absolute';b.style.left=Math.round(Math.random()*maxX)+'px';b.style.top=Math.round(Math.random()*maxY)+'px';b.style.transform=`rotate(${Math.round((Math.random()-.5)*30)}deg) scale(${.9+Math.random()*.18})`;const msgs=['أوووبس! هربت 😂💨','مش بهالسهولة! جرّب مرة ثانية 🙈','زر «لا» عنده خطّة هروب سرّية 🏃‍♂️💨','واضح إنه حتى الزر عارف إنك لازم تختار 😍'];root.querySelector('#msg').innerHTML=`<div class="toast">${msgs[Math.min(noCount-1,msgs.length-1)]}</div>`}b.addEventListener('pointerenter',flee);b.addEventListener('click',flee);b.addEventListener('touchstart',flee,{passive:false})}function showDay(){render(`<div class="eyebrow">السؤال الثاني · تحديد الموعد</div><h2>متى بدنا نطلع يا روحي؟ 🌙</h2><div class="actions"><button class="choice" data-day="اليوم المسا">🥰❤️ اليوم المسا</button><button class="choice" data-day="بكرا المسا">🌙💗 بكرا المسا</button><button class="choice" data-bad="busy">🌝 عَ فضاوة وروقان</button><button class="choice" data-bad="home">🏠 بلا ما نطلع، منضل بالبيت</button></div><div id="msg" aria-live="polite"></div>`);root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;showDestination()});root.querySelectorAll('[data-bad]').forEach(b=>b.onclick=()=>{const text=b.dataset.bad==='home'?'البيت رح يضل موجود بكرا، أما موعدنا إله أولوية! 😂❤️':'تم رفض الطلب من قِبل المديرية العامة للرومانسية 😂❤️';root.querySelector('#msg').innerHTML=`<div class="toast">${text}</div>`})}function showDestination(){render(`<div class="eyebrow">السؤال الثالث · الوجهة</div><h2>وين بدك تاخدني يا روحي؟ ❤️</h2><div class="actions"><button class="choice" data-d="restaurant">🍔 عشاء بمطعم ولفة بالسيارة</button><button class="choice" data-d="cafe">☕ كافيه وقعدة حلوة</button><button class="choice" data-d="drive">🚗 نجيب إشي طيب ونطلع نتمشى بالسيارة</button><button class="choice" data-d="surprise">🎁 مفاجأة من اختيارك</button></div>`);root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.destination=b.dataset.d;state.food='';if(state.destination==='surprise')showSurprise();else showFood()})}function showSurprise(){render(`<div class="moon">🎁 ❤️‍🔥</div><div class="eyebrow">اختيار صاحب المفاجآت</div><h2>يا سيّد المفاجآت! 😏</h2><p>بما إنك اخترت مفاجأة معناتك لسا متذكر إنه حبيبتك بتحبّ المفاجآت، وحابب تعمللها يوم غير شكل ❤️‍🔥</p><button class="primary" id="next">نكمل يا صاحب الأسرار 🌙</button>`);root.querySelector('#next').onclick=showTime}function showFood(){let title,items;if(state.destination==='restaurant'){title='طيب يا روحي، شو بتحب نتعشّى؟ 🍽️❤️';items=['🍔 برجر من المطعم اللي جرّبناه مع بعض بيوم ميلادك 🌝❤️','🍕 بيتزا','🍗 وجبة دجاج','🍣 سوشي','🌯 شاورما','🎲 إشي من اختيارك']}else if(state.destination==='cafe'){title='طيب يا روحي، شو عبالك نطلب بالكافيه؟ ☕🤎';items=['☕ قهوة وحلو','🥞 بان كيك أو وافل','🍰 تشيز كيك أو قطعة كيك','🥤 كوكتيل أو عصير','🎲 إشي من اختيارك']}else{title='طيب يا روحي، شو بدك نجيب معنا للمشوار؟ 🚗🌙';items=['🍔 برجر','🌯 شاورما','🍟 بطاطا ومقبلات','🥤 مشروب بارد مع سناك','🍕 بيتزا','🎲 إشي من اختيارك']}render(`<div class="eyebrow">اختيار التفاصيل · على ذوقك</div><h2>${title}</h2><div class="actions">${items.map((x,i)=>`<button class="choice" data-food="${i}">${x}</button>`).join('')}</div><div id="custom"></div>`);root.querySelectorAll('[data-food]').forEach((b,i)=>b.onclick=()=>{if(items[i].includes('إشي من اختيارك')){root.querySelector('#custom').innerHTML=`<label for="foodInput">شو الإشي اللي ببالك؟</label><input class="input" id="foodInput" maxlength="100" placeholder="اكتب اختيارك هون..."><button class="primary" id="saveFood" style="margin-top:12px">اعتماد الاختيار ❤️</button>`;root.querySelector('#saveFood').onclick=()=>{let v=root.querySelector('#foodInput').value.trim();if(!v){root.querySelector('#foodInput').focus();return}state.food=v;showTime()}}else{state.food=items[i].replace(/^[^ ]+ /,'');showTime()}})}function showTime(){render(`<div class="eyebrow">السؤال التالي · الوقت</div><h2>طيب يا روحي، أي ساعة بتناسبك؟ 🕰️❤️</h2><div class="actions"><button class="choice" data-t="الساعة ٦ المسا">🕕✨ الساعة ٦ المسا</button><button class="choice" data-t="الساعة ٧ المسا">🕖💕 الساعة ٧ المسا</button><button class="choice" data-t="الساعة ٨ المسا">🕗🌹 الساعة ٨ المسا</button><button class="choice" data-t="الساعة ٩ المسا">🕘💫 الساعة ٩ المسا</button><button class="choice" data-t="custom">🎲 الوقت اللي بتختاره إنت</button></div><div id="custom"></div>`);root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='custom'){root.querySelector('#custom').innerHTML=`<label for="timeInput">أي ساعة بتختار؟</label><input class="input" id="timeInput" maxlength="50" placeholder="مثلاً: الساعة ٧ ونص"><button class="primary" id="saveTime" style="margin-top:12px">اعتماد الوقت ❤️</button>`;root.querySelector('#saveTime').onclick=()=>{let v=root.querySelector('#timeInput').value.trim();if(v){state.time=v;showExtra()}}}else{state.time=b.dataset.t;showExtra()}})}function showExtra(){render(`<div class="eyebrow">اللمسة الأخيرة</div><h2>قبل ما نكمل... عندك إشي أخير حاب تضيفه لموعدنا؟ 😏❤️</h2><div class="actions"><button class="choice" data-e="لا، هيك موعدنا كامل!">❤️ لا، هيك موعدنا كامل!</button><button class="choice" data-e="عندي لمسة خاصة لحبيبتي.">🌹 عندي لمسة خاصة لحبيبتي.</button><button class="choice" data-e="خليها مفاجأة!">🤫 خليها مفاجأة!</button></div><div id="custom"></div>`);root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{if(b.dataset.e.startsWith('عندي')){root.querySelector('#custom').innerHTML=`<label for="extraInput">شو اللمسة اللي محضّرها؟ (اختياري)</label><input class="input" id="extraInput" maxlength="120" placeholder="اكتبها هون أو خليها سرّ..."><button class="primary" id="saveExtra" style="margin-top:12px">كمّل للتصريح 💌</button>`;root.querySelector('#saveExtra').onclick=()=>{state.extra=root.querySelector('#extraInput').value.trim()||b.dataset.e;showPermit()}}else{state.extra=b.dataset.e;showPermit()}})}function showPermit(){let dest={restaurant:'عشاء بمطعم ولفة بالسيارة',cafe:'كافيه وقعدة حلوة',drive:'نجيب إشي طيب ونتمشى بالسيارة',surprise:'مفاجأة من اختيار صاحب التصريح'}[state.destination];let food=state.destination==='surprise'?'مفاجأة من اختيار صاحب التصريح':state.food;let when=state.day==='اليوم المسا'?'موعدنا اليوم المسا ❤️':'موعدنا بكرا المسا ❤️';render(`<div style="text-align:center"><div class="envelope">💌</div><div class="eyebrow">وصلت الدعوة الرسمية</div><h1>تمت الموافقة! ❤️</h1><p>لحظة... عم نجهّز التصريح الخاص فيكم.</p><button class="primary" id="open">افتح الظرف وشوف الدعوة ✨</button></div>`);root.querySelector('#open').onclick=()=>{render(`<div style="text-align:center"><div class="seal">المديرية العامة<br>للرومانسية<br>♥ موافق ♥</div><h1>تصريح رسمي لمشوار وحكي من القلب</h1><p>قسم المواعيد واللحظات الجميلة</p></div><div class="letter"><h2>💌 دعوة خاصة لحبيبتي</h2><div class="detail"><span>📅 الموعد</span><span>${esc(state.day)}</span></div><div class="detail"><span>📍 الوجهة</span><span>${esc(dest)}</span></div><div class="detail"><span>🍽️ الطلب</span><span>${esc(food||'حسب اختيار صاحب التصريح')}</span></div><div class="detail"><span>🕰️ الساعة</span><span>${esc(state.time)}</span></div>${state.extra?`<div class="detail"><span>🌹 اللمسة الأخيرة</span><span>${esc(state.extra)}</span></div>`:''}<div class="rule"></div><p>حبيبتي ❤️<br>أنا بعزمك على موعد خاص، نغيّر فيه جو، وننبسط مع بعض، ونسرق إلنا شويّة وقت بعيد عن دوشة الأيام.<br><br>وبشهد إني اخترت هالقرارات بإرادتي الحرة تمامًا، وما حدا أجبرني على أي إشي 😂❤️<br><br>جهّزي حالك لأمسية حلوة مع بعض، فيها ضحك وحكي من القلب وذكريات جديدة.<br><strong>بحبّك كثير 💕</strong></p><div class="rule"></div><p><strong>تمت الموافقة على الطلب بنجاح!</strong><br>يُمنح صاحب التصريح إذنًا رسميًا بالخروج في موعد رومانسي مع زوجته الحلوة، مع الالتزام بكافة قوانين الدلال والرومانسية 😂❤️</p><p style="text-align:center">مع أطيب التمنيات<br><strong>المديرية العامة للرومانسية ♥</strong></p></div><div class="note" style="text-align:center">${state.day==='اليوم المسا'?'تم حجز موعدكم لليلة!':'تم حجز موعدكم لبكرا!'} بانتظار أحلى طلعة مع أحلى حبيبة ❤️🌙</div><div class="invite-promo"><div style="font-size:1.7rem">💌✨</div><strong>جهزنالك بطاقة دعوة إلكترونية ترسلها لزوجتك الحلوة</strong><p style="margin:6px 0 0">حوّل التصريح لبطاقة أنيقة، واحفظها صورة وابعثها لحبيبتك 💗</p><div class="invite-actions"><button class="primary" id="makeInvite">🎨 إنشاء بطاقة الدعوة</button><button class="choice hidden" id="saveInvite">🖼️ حفظ البطاقة كصورة PNG</button><button class="choice hidden" id="shareInvite">💌 مشاركة البطاقة</button></div><div id="invitePreview" style="margin-top:14px"></div><div id="inviteMsg" aria-live="polite"></div></div><button class="secondary" id="restart" style="margin-top:14px">↻ إعادة مشاهدة الموقع</button>`);root.querySelector('#makeInvite').onclick=()=>{const preview=root.querySelector('#invitePreview');const dateText=state.day==='اليوم المسا'?'اليوم مساءً':'غدًا مساءً';const foodText=food||'مفاجأة على ذوقك';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a32"/><stop offset="1" stop-color="#39304a"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#fff8eb"/><stop offset="1" stop-color="#f5dfc5"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg)"/><g fill="#ffd7cb" opacity=".8" font-size="26"><text x="95" y="130">✦</text><text x="930" y="200">✧</text><text x="140" y="1180">♡</text><text x="920" y="1130">✦</text></g><rect x="70" y="65" width="940" height="1220" rx="42" fill="url(#paper)" stroke="#d8ad70" stroke-width="5"/><rect x="95" y="90" width="890" height="1170" rx="30" fill="none" stroke="#d8ad70" stroke-width="2" stroke-dasharray="8 12"/><text x="540" y="190" text-anchor="middle" font-size="48" fill="#a45d61">♥ دعوة خاصة من القلب ♥</text><text x="540" y="285" text-anchor="middle" font-size="70" font-weight="bold" fill="#4c3027">موعد مع حبيبتي</text><text x="540" y="355" text-anchor="middle" font-size="34" fill="#87654f">مشوار وحكي من القلب</text><path d="M250 410 Q540 470 830 410" fill="none" stroke="#d8ad70" stroke-width="3"/><text x="540" y="505" text-anchor="middle" font-size="38" fill="#4c3027">إلى زوجتي الحلوة… ❤️</text><text x="540" y="570" text-anchor="middle" font-size="31" fill="#60473a">بعزمك على أمسية إلنا إحنا وبس،</text><text x="540" y="620" text-anchor="middle" font-size="31" fill="#60473a">نضحك فيها ونحكي ونصنع ذكرى حلوة.</text><g font-size="32" fill="#4c3027"><text x="850" y="730" text-anchor="end">📅 الموعد</text><text x="230" y="730" text-anchor="start">${xmlEscape(dateText)}</text><text x="850" y="810" text-anchor="end">📍 الوجهة</text><text x="230" y="810" text-anchor="start">${xmlEscape(dest)}</text><text x="850" y="890" text-anchor="end">🍽️ الطلب</text><text x="230" y="890" text-anchor="start">${xmlEscape(foodText)}</text><text x="850" y="970" text-anchor="end">🕰️ الساعة</text><text x="230" y="970" text-anchor="start">${xmlEscape(state.time)}</text></g><path d="M250 1030 Q540 1090 830 1030" fill="none" stroke="#d8ad70" stroke-width="3"/><text x="540" y="1110" text-anchor="middle" font-size="36" fill="#a45d61">جهّزي حالك لأحلى طلعة 💕</text><text x="540" y="1175" text-anchor="middle" font-size="33" font-weight="bold" fill="#4c3027">بحبّك كثير</text><text x="540" y="1225" text-anchor="middle" font-size="24" fill="#87654f">المديرية العامة للرومانسية ✦</text></svg>`;const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);preview.innerHTML=`<img id="inviteImagePreview" alt="معاينة بطاقة الدعوة" style="width:100%;max-width:360px;border-radius:14px;box-shadow:0 8px 24px #4c302733" src="${data}"><p class="muted" style="font-size:.85rem">بطاقتك جاهزة! اضغطي حفظ الصورة أو مشاركة البطاقة 💗</p>`;root.querySelector('#saveInvite').classList.remove('hidden');root.querySelector('#shareInvite').classList.remove('hidden');burstHearts();root.querySelector('#inviteMsg').innerHTML='<div class="toast">انعملت البطاقة بنجاح! ✨</div>';};function xmlEscape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}root.querySelector('#saveInvite').onclick=async()=>{const preview=root.querySelector('#inviteImagePreview');if(!preview)return;try{const response=await fetch(preview.src);const svgBlob=await response.blob();const svgUrl=URL.createObjectURL(svgBlob);const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);canvas.toBlob(blob=>{if(!blob){root.querySelector('#inviteMsg').innerHTML='<div class="toast">تعذّر إنشاء PNG؛ جرّبي مشاركة البطاقة أو حفظ الصورة من المعاينة.</div>';URL.revokeObjectURL(svgUrl);return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='دعوة-موعد-رومانسي.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);root.querySelector('#inviteMsg').innerHTML='<div class="toast">جهزت الصورة للحفظ 🌸 إذا ما نزلت تلقائيًا على الآيفون، افتحي المعاينة واضغطي مطولًا عليها ثم «حفظ في الصور».</div>';URL.revokeObjectURL(svgUrl)},'image/png')};img.onerror=()=>{root.querySelector('#inviteMsg').innerHTML='<div class="toast">اضغطي مطولًا على معاينة البطاقة واختاري حفظ الصورة 💗</div>';URL.revokeObjectURL(svgUrl)};img.src=svgUrl}catch(e){root.querySelector('#inviteMsg').innerHTML='<div class="toast">اضغطي مطولًا على معاينة البطاقة واختاري حفظ الصورة 💗</div>'}};root.querySelector('#shareInvite').onclick=async()=>{const img=root.querySelector('#inviteImagePreview');try{const res=await fetch(img.src);const blob=await res.blob();const file=new File([blob],'بطاقة-دعوة.svg',{type:'image/svg+xml'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'دعوة خاصة من القلب',text:'جهزنالك بطاقة دعوة إلكترونية ترسلها لزوجتك الحلوة 💗'})}else{const a=document.createElement('a');a.href=img.src;a.download='بطاقة-دعوة.svg';a.click();root.querySelector('#inviteMsg').innerHTML='<div class="toast">نزّلي البطاقة أولًا، وبعدها ابعتيها من الصور أو الملفات 💌</div>'}}catch(e){root.querySelector('#inviteMsg').innerHTML='<div class="toast">تقدري تحفظي البطاقة كصورة وبعدين تشاركيها من جهازك 💗</div>'}};root.querySelector('#restart').onclick=()=>{Object.keys(state).forEach(k=>state[k]='');noCount=0;showWelcome()}}}showWelcome()})();

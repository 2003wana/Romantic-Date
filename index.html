<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#171a32">
<title>مشوار وحكي من القلب ❤️</title>
<style>
:root{--night:#171a32;--night2:#292844;--cream:#fff5e5;--paper:#f7e7cd;--ink:#4c3027;--rose:#e98c91;--rose2:#ffd1c9;--gold:#d8ad70}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at top,#35304c 0,#171a32 55%,#101223 100%);color:var(--cream);min-height:100vh;overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 70% 20%,#ffd9b3 50%,transparent 55%),radial-gradient(2px 2px at 80% 70%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 35% 80%,#ffd9b3 50%,transparent 55%);background-size:190px 170px,240px 230px,280px 250px,220px 200px;z-index:-1}.wrap{width:min(100% - 28px,650px);margin:0 auto;padding:28px 0 45px}.brand{text-align:center;color:#ffd7cb;font-size:.9rem;letter-spacing:.04em;margin-bottom:18px}.card{background:linear-gradient(145deg,rgba(255,245,229,.98),rgba(247,231,205,.98));color:var(--ink);border:1px solid #e8c99f;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 45px #08091770;animation:rise .45s ease both}.hidden{display:none!important}.moon{font-size:2.2rem}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.75rem;color:#93664d;font-weight:800}.card h1,.card h2{line-height:1.4;margin:.45rem 0 1rem}.card h1{font-size:clamp(1.7rem,5vw,2.35rem)}.card h2{font-size:clamp(1.35rem,4vw,1.8rem)}p{line-height:1.9}.muted{color:#7c6254}.actions{display:grid;gap:11px;margin-top:24px}.choice,.primary,.secondary{font:inherit;font-weight:700;border-radius:15px;padding:14px 16px;min-height:50px;border:1px solid #ddc2a3;background:#fffaf1;color:var(--ink);cursor:pointer;text-align:right;transition:transform .15s,border-color .15s,background .15s;width:100%}.choice:hover,.choice:focus-visible{border-color:var(--rose);background:#fff0eb;outline:2px solid #e98c9155}.choice:active,.primary:active{transform:scale(.99)}.primary{background:var(--rose);color:#351d26;border:0;text-align:center}.secondary{text-align:center;background:transparent}.choice .sub{display:block;font-weight:400;font-size:.83rem;color:#85695a;margin-top:3px}.note{margin-top:18px;padding:12px 14px;border-right:4px solid var(--rose);background:#fbe6dc;border-radius:10px;line-height:1.7;font-size:.92rem}.seal{display:inline-grid;place-items:center;border:2px solid #a54d4d;color:#a54d4d;border-radius:50%;width:86px;height:86px;text-align:center;font-size:.75rem;font-weight:900;transform:rotate(-10deg);margin:4px}.envelope{font-size:4rem;display:block;text-align:center;animation:float 2.5s ease-in-out infinite}.letter{background:#fff7e9;border:1px solid #d9b886;padding:20px;border-radius:6px;box-shadow:inset 0 0 0 5px #f3e0c2;margin-top:18px}.letter h2{text-align:center;color:#7e3f3c}.letter .rule{border-top:1px dashed #c9a27b;margin:12px 0}.detail{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #ddc3a2}.detail span:first-child{color:#87654f;font-weight:700}.detail span:last-child{text-align:left;overflow-wrap:anywhere}.closing{text-align:center;color:#ffdbce;margin-top:25px;line-height:1.9}.toast{margin-top:15px;padding:12px;border-radius:12px;background:#f9dcd4;color:#752d39;font-weight:700;text-align:center;animation:rise .25s ease}.tiny{text-align:center;font-size:.82rem;color:#8d6d59;margin-top:18px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #d8b99b;background:#fffaf2;font:inherit;font-size:16px;color:var(--ink);margin-top:8px}.heart{color:#bb535e}.footer{text-align:center;color:#d6c3c5;font-size:.8rem;margin-top:22px}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(min-width:560px){.actions.two{grid-template-columns:1fr 1fr}.actions.two .choice{height:100%}}
</style></head><body><div class="stars"></div><main class="wrap"><div class="brand">☾ ✦ المديرية العامة للرومانسية ✦ ☾</div><section id="screen" class="card" aria-live="polite"></section><div class="closing">صُنعت بكل حبّ، لحبيبتك المفضّلة <span class="heart">♥</span></div><div class="footer">تصريح رسمي للمشاعر الجميلة 😂❤️</div></main>
<script>
(()=>{const root=document.getElementById('screen');const state={day:'',destination:'',food:'',time:'',extra:''};let noCount=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(html){root.innerHTML=html;root.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start')}function buttons(items,fn){return `<div class="actions">${items.map((x,i)=>`<button class="choice" type="button" data-i="${i}">${x.label||x}</button>`).join('')}</div>`}function showWelcome(){render(`<div class="moon">🌙 💌</div><div class="eyebrow">دعوة سرّية لشخص مميّز</div><h1>مرحبًا يا روحي ❤️</h1><p>هالموقع مش بس أسئلة...<br>هو بداية لموعد حلو،<br>وجلسة مليانة حب وضحك،<br>فأنت مستعد؟</p><button class="primary" id="start">يلا نبدأ ♥</button>`);root.querySelector('#start').onclick=showQ1}function showQ1(){render(`<div class="moon">💘</div><div class="eyebrow">السؤال الأول · فحص الجاهزية</div><h2>حاب تعزمني عَ موعد خاصّ، صح؟ 😏❤️</h2><div class="actions"><button class="choice" id="yes">❤️ أكيد، من عيوني!</button><button class="choice" id="no">🙄 لا</button></div><div id="msg" aria-live="polite"></div>`);root.querySelector('#yes').onclick=showDay;root.querySelector('#no').onclick=()=>{noCount++;const msgs=['متأكد من إجابتك؟ فكّر منيح 😂','حبيبتك بتراقب قراراتك حاليًا 👀','تم رفض الطلب من قِبل المديرية العامة للرومانسية 😂❤️'];const m=root.querySelector('#msg');m.innerHTML=`<div class="toast">${msgs[Math.min(noCount-1,msgs.length-1)]}</div><button class="primary" id="retry" style="margin-top:12px">رجّعني للطريق الصح ❤️</button>`;root.querySelector('#retry').onclick=showQ1;const b=root.querySelector('#no');b.style.transform=`translate(${(Math.random()-.5)*50}px,${(Math.random()-.5)*15}px)`}}function showDay(){render(`<div class="eyebrow">السؤال الثاني · تحديد الموعد</div><h2>متى بدنا نطلع يا روحي؟ 🌙</h2><div class="actions"><button class="choice" data-day="اليوم المسا">❤️ اليوم المسا</button><button class="choice" data-day="بكرا المسا">🥰 بكرا المسا</button><button class="choice" data-bad="busy">🌝 عَ فضاوة وروقان</button><button class="choice" data-bad="home">🏠 بلا ما نطلع، منضل بالبيت</button></div><div id="msg" aria-live="polite"></div>`);root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;showDestination()});root.querySelectorAll('[data-bad]').forEach(b=>b.onclick=()=>{const text=b.dataset.bad==='home'?'البيت رح يضل موجود بكرا، أما موعدنا إله أولوية! 😂❤️':'تم رفض الطلب من قِبل المديرية العامة للرومانسية 😂❤️';root.querySelector('#msg').innerHTML=`<div class="toast">${text}</div>`})}function showDestination(){render(`<div class="eyebrow">السؤال الثالث · الوجهة</div><h2>وين بدك تاخدني يا روحي؟ ❤️</h2><div class="actions"><button class="choice" data-d="restaurant">🍔 عشاء بمطعم ولفة بالسيارة</button><button class="choice" data-d="cafe">☕ كافيه وقعدة حلوة</button><button class="choice" data-d="drive">🚗 نجيب إشي طيب ونطلع نتمشى بالسيارة</button><button class="choice" data-d="surprise">🎁 مفاجأة من اختيارك</button></div>`);root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.destination=b.dataset.d;state.food='';if(state.destination==='surprise')showSurprise();else showFood()})}function showSurprise(){render(`<div class="moon">🎁 ❤️‍🔥</div><div class="eyebrow">اختيار صاحب المفاجآت</div><h2>يا سيّد المفاجآت! 😏</h2><p>بما إنك اخترت مفاجأة معناتك لسا متذكر إنه حبيبتك بتحبّ المفاجآت، وحابب تعمللها يوم غير شكل ❤️‍🔥</p><button class="primary" id="next">نكمل يا صاحب الأسرار 🌙</button>`);root.querySelector('#next').onclick=showTime}function showFood(){let title,items;if(state.destination==='restaurant'){title='طيب يا روحي، شو بتحب نتعشّى؟ 🍽️❤️';items=['🍔 برجر من المطعم اللي جرّبناه مع بعض بيوم ميلادك 🌝❤️','🍕 بيتزا','🍗 وجبة دجاج','🍣 سوشي','🌯 شاورما','🎲 إشي من اختيارك']}else if(state.destination==='cafe'){title='طيب يا روحي، شو عبالك نطلب بالكافيه؟ ☕🤎';items=['☕ قهوة وحلو','🥞 بان كيك أو وافل','🍰 تشيز كيك أو قطعة كيك','🥤 كوكتيل أو عصير','🎲 إشي من اختيارك']}else{title='طيب يا روحي، شو بدك نجيب معنا للمشوار؟ 🚗🌙';items=['🍔 برجر','🌯 شاورما','🍟 بطاطا ومقبلات','🥤 مشروب بارد مع سناك','🍕 بيتزا','🎲 إشي من اختيارك']}render(`<div class="eyebrow">اختيار التفاصيل · على ذوقك</div><h2>${title}</h2><div class="actions">${items.map((x,i)=>`<button class="choice" data-food="${i}">${x}</button>`).join('')}</div><div id="custom"></div>`);root.querySelectorAll('[data-food]').forEach((b,i)=>b.onclick=()=>{if(items[i].includes('إشي من اختيارك')){root.querySelector('#custom').innerHTML=`<label for="foodInput">شو الإشي اللي ببالك؟</label><input class="input" id="foodInput" maxlength="100" placeholder="اكتب اختيارك هون..."><button class="primary" id="saveFood" style="margin-top:12px">اعتماد الاختيار ❤️</button>`;root.querySelector('#saveFood').onclick=()=>{let v=root.querySelector('#foodInput').value.trim();if(!v){root.querySelector('#foodInput').focus();return}state.food=v;showTime()}}else{state.food=items[i].replace(/^[^ ]+ /,'');showTime()}})}function showTime(){render(`<div class="eyebrow">السؤال التالي · الوقت</div><h2>طيب يا روحي، أي ساعة بتناسبك؟ 🕰️❤️</h2><div class="actions"><button class="choice" data-t="الساعة ٦ المسا">🕕 الساعة ٦ المسا</button><button class="choice" data-t="الساعة ٧ المسا">🕖 الساعة ٧ المسا</button><button class="choice" data-t="الساعة ٨ المسا">🕗 الساعة ٨ المسا</button><button class="choice" data-t="الساعة ٩ المسا">🕘 الساعة ٩ المسا</button><button class="choice" data-t="custom">🎲 الوقت اللي بتختاره إنت</button></div><div id="custom"></div>`);root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='custom'){root.querySelector('#custom').innerHTML=`<label for="timeInput">أي ساعة بتختار؟</label><input class="input" id="timeInput" maxlength="50" placeholder="مثلاً: الساعة ٧ ونص"><button class="primary" id="saveTime" style="margin-top:12px">اعتماد الوقت ❤️</button>`;root.querySelector('#saveTime').onclick=()=>{let v=root.querySelector('#timeInput').value.trim();if(v){state.time=v;showExtra()}}}else{state.time=b.dataset.t;showExtra()}})}function showExtra(){render(`<div class="eyebrow">اللمسة الأخيرة</div><h2>قبل ما نكمل... عندك إشي أخير حاب تضيفه لموعدنا؟ 😏❤️</h2><div class="actions"><button class="choice" data-e="لا، هيك موعدنا كامل!">❤️ لا، هيك موعدنا كامل!</button><button class="choice" data-e="عندي لمسة خاصة لحبيبتي.">🌹 عندي لمسة خاصة لحبيبتي.</button><button class="choice" data-e="خليها مفاجأة!">🤫 خليها مفاجأة!</button></div><div id="custom"></div>`);root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{if(b.dataset.e.startsWith('عندي')){root.querySelector('#custom').innerHTML=`<label for="extraInput">شو اللمسة اللي محضّرها؟ (اختياري)</label><input class="input" id="extraInput" maxlength="120" placeholder="اكتبها هون أو خليها سرّ..."><button class="primary" id="saveExtra" style="margin-top:12px">كمّل للتصريح 💌</button>`;root.querySelector('#saveExtra').onclick=()=>{state.extra=root.querySelector('#extraInput').value.trim()||b.dataset.e;showPermit()}}else{state.extra=b.dataset.e;showPermit()}})}function showPermit(){let dest={restaurant:'عشاء بمطعم ولفة بالسيارة',cafe:'كافيه وقعدة حلوة',drive:'نجيب إشي طيب ونتمشى بالسيارة',surprise:'مفاجأة من اختيار صاحب التصريح'}[state.destination];let food=state.destination==='surprise'?'مفاجأة من اختيار صاحب التصريح':state.food;let when=state.day==='اليوم المسا'?'موعدنا اليوم المسا ❤️':'موعدنا بكرا المسا ❤️';render(`<div style="text-align:center"><div class="envelope">💌</div><div class="eyebrow">وصلت الدعوة الرسمية</div><h1>تمت الموافقة! ❤️</h1><p>لحظة... عم نجهّز التصريح الخاص فيكم.</p><button class="primary" id="open">افتح الظرف وشوف الدعوة ✨</button></div>`);root.querySelector('#open').onclick=()=>{render(`<div style="text-align:center"><div class="seal">المديرية العامة<br>للرومانسية<br>♥ موافق ♥</div><h1>تصريح رسمي لمشوار وحكي من القلب</h1><p>قسم المواعيد واللحظات الجميلة</p></div><div class="letter"><h2>💌 دعوة خاصة لحبيبتي</h2><div class="detail"><span>📅 الموعد</span><span>${esc(state.day)}</span></div><div class="detail"><span>📍 الوجهة</span><span>${esc(dest)}</span></div><div class="detail"><span>🍽️ الطلب</span><span>${esc(food||'حسب اختيار صاحب التصريح')}</span></div><div class="detail"><span>🕰️ الساعة</span><span>${esc(state.time)}</span></div>${state.extra?`<div class="detail"><span>🌹 اللمسة الأخيرة</span><span>${esc(state.extra)}</span></div>`:''}<div class="rule"></div><p>حبيبتي ❤️<br>أنا بعزمك على موعد خاص، نغيّر فيه جو، وننبسط مع بعض، ونسرق إلنا شويّة وقت بعيد عن دوشة الأيام.<br><br>وبشهد إني اخترت هالقرارات بإرادتي الحرة تمامًا، وما حدا أجبرني على أي إشي 😂❤️<br><br>جهّزي حالك لأمسية حلوة مع بعض، فيها ضحك وحكي من القلب وذكريات جديدة.<br><strong>بحبّك كثير 💕</strong></p><div class="rule"></div><p><strong>تمت الموافقة على الطلب بنجاح!</strong><br>يُمنح صاحب التصريح إذنًا رسميًا بالخروج في موعد رومانسي مع زوجته الحلوة، مع الالتزام بكافة قوانين الدلال والرومانسية 😂❤️</p><p style="text-align:center">مع أطيب التمنيات<br><strong>المديرية العامة للرومانسية ♥</strong></p></div><div class="note" style="text-align:center">${state.day==='اليوم المسا'?'تم حجز موعدكم لليلة!':'تم حجز موعدكم لبكرا!'} بانتظار أحلى طلعة مع أحلى حبيبة ❤️🌙</div><button class="secondary" id="restart" style="margin-top:14px">↻ إعادة مشاهدة الموقع</button>`);root.querySelector('#restart').onclick=()=>{Object.keys(state).forEach(k=>state[k]='');noCount=0;showWelcome()}}}showWelcome()})();
</script></body></html>
